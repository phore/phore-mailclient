name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring, iconv, openssl, zip, fileinfo, :imap
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Generated mailbox reference and unit tests
        run: |
          composer check-config-reference
          git diff --exit-code -- mailbox-config.reference.json
          vendor/bin/phpunit test/Unit
      - name: Syntax and offline example
        run: |
          find src test examples/api tools -name '*.php' -print0 | xargs -0 -n1 php -l
          php examples/api/addresses.php
      - name: Disposable Dovecot with verified TLS
        run: bash test/Integration/dovecot.sh
      - run: timeout 180 vendor/bin/phpunit --debug
        env:
          PHORE_TEST_IMAP: '1'
